name: Linux x64 Build (Deepin)

on:
  workflow_dispatch:
    branches: [master]
    inputs:
      build_type:
        description: 编译类型
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译构建
    runs-on: ubuntu-latest
    container: linuxdeepin/deepin:crimson-amd64-v1.6.0

    env:
      GODOT_RELEASE: 4.7-stable
      GODOT_TEMPLATE_VERSION: 4.7.stable
      AETHERKIRI_ENABLE_INTERNAL: "OFF"
      AETHERKIRI_CACHE_DIR: ${{ github.workspace }}/.aetherkiri-cache
      CCACHE_DIR: ${{ github.workspace }}/.aetherkiri-cache/ccache
      # ccache 配置:容器 FS 一般不支持 hardlink,改用 fileclone + 放宽 sloppiness
      CCACHE_FILECLONE: "1"
      CCACHE_SLOPPINESS: "time_macros,file_macro,include_file_ctime,include_file_mtime,locale,system_headers"
      CCACHE_UMASK: "002"
      VCPKG_ROOT: ${{ github.workspace }}/.aetherkiri-cache/vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.aetherkiri-cache/vcpkg-downloads
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.aetherkiri-cache/vcpkg-binaries
      # vcpkg 并发限制:vcpkg 默认 MAX_CONCURRENCY=nproc,在 Deepin 容器里会让
      # 多路 meson/cmake get-vars 同时跑,gcc/c++ 互相抢内存触发 OOM,
      # 导致 cmake 把"测试编译失败"误报成 CMAKE_C_COMPILER not set
      VCPKG_MAX_CONCURRENCY: "2"
      VCPKG_BUILD_TYPE: release
      # 强制关掉所有 meson port 的 introspection(gobject-introspection 1.0 检测常挂)
      VCPKG_MESON_CONFIGURE_OPTIONS: "-Dintrospection=disabled"
      # 给 cmake/meson 一个已知的编译器,别让它瞎探测
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      BUILD_TYPE: ${{ inputs.build_type }}

    # 关键:Deepin 镜像没设 WORKDIR,run: 步骤默认 CWD 会落到 / 或临时目录,
    # 导致 git submodule 找不到 .git。强制所有步骤 CWD = workspace
    defaults:
      run:
        working-directory: ${{ github.workspace }}
        shell: bash

    steps:
      - name: 安装所需依赖
        run: |
          set -euo pipefail
          # 必须在 actions/checkout 之前装 git —— checkout@v4 没 git 会 fallback 到下载 tarball,
          # 那种模式不下 .git,后续所有 git submodule / git clone vcpkg 都会找不到仓库
          # mono-complete:vcpkg 的 NuGet 二进制缓存(GitHub Packages)在 Linux 下靠 mono 执行 nuget.exe
          # gobjc gobjc++:AetherKiri 的 overlay pango portfile 硬编了 LANGUAGES C CXX OBJC,
          # 即使我们不交叉编译到 darwin,vcpkg_cmake_get_vars 在 Linux 上也必须能探测到 OBJC 编译器才能过
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config \
              autoconf autoconf-archive automake libtool \
              gettext bison flex curl unzip zip zstd xz-utils \
              ccache ca-certificates git \
              nasm yasm \
              libgl1 libglu1-mesa libasound2 libpulse0 \
              libxkbcommon0 libwayland-client0 libxrandr2 libxinerama1 \
              libxcursor1 libxi6 libxext6 libglib2.0-0 \
              libfontconfig1 libfreetype6 libudev1 libdbus-1-3 \
              python3 \
              mono-complete
          rm -rf /var/lib/apt/lists/*
          # 验证 mono 真装上了(早期发现 apt 镜像里偶尔因依赖解析静默跳过)
          mono --version | head -1
          # gobjc 兜底:仅 Debian 官方仓库有 gobjc/libgobjc-*-dev,Deepin 仓库不收录。
          # 反正编译前会把 overlay pango portfile 里的 OBJC sed 掉,这里装不上也不阻塞。
          if apt-get install -y --no-install-recommends gobjc gobjc++; then
            echo "==> gobjc 已安装(OBJC 兜底生效)"
            gobjc --version | head -1
          else
            echo "==> Deepin 仓库无 gobjc,跳过(依赖编译前的 OBJC sed 修补)"
          fi
          # X11 dev 兜底:AetherKiri 的 overlay libgdiplus portfile 在 Linux 上无条件
          # -DWITH_X11=ON,X11 不是 vcpkg port 是系统库,所以容器里必须有 X11 dev headers。
          # 教训:不能把一堆包装进一条 apt-get install —— Deepin 仓库缺任何一个包名都会
          # 导致整条命令失败、全军覆没(和 gobjc 一样的坑),所以逐个装、缺哪个跳哪个。
          X11_PKGS="libx11-dev libxext-dev libxrender-dev libxrandr-dev \
                    libxinerama-dev libxcursor-dev libxi-dev libxau-dev libxdmcp-dev \
                    libxcb1-dev libpthread-stubs-dev \
                    libfontconfig1-dev libfreetype6-dev \
                    libcairo2-dev libpango1.0-dev libglib2.0-dev"
          FAILED_PKGS=""
          for p in $X11_PKGS; do
            if apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1; then
              echo "  [ok]   $p"
            else
              echo "  [miss] $p  (Deepin 仓库未收录,跳过)"
              FAILED_PKGS="$FAILED_PKGS $p"
            fi
          done
          if [[ -n "$FAILED_PKGS" ]]; then
            echo "::warning::以下 X11/cairo dev 包未装上:$FAILED_PKGS"
          fi
          # 关键自检:x11 + xrender 是 libgdiplus WITH_X11=ON 的硬需求
          if pkg-config --exists x11 && pkg-config --exists xrender; then
            echo "==> pkg-config x11/xrender 自检通过:"
            pkg-config --modversion x11 xrender
          else
            echo "::error::pkg-config 找不到 x11 或 xrender,libgdiplus 的 find_package(X11 REQUIRED) 必挂"
            exit 1
          fi

      - name: 检查代码
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: 启用子模块(公网回退)
        run: |
          set -euo pipefail
          # 即使设了 defaults.working-directory,仍显式 cd + 放宽 git 安全检查 + 允许跨 FS 边界
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          export GIT_DISCOVERY_ACROSS_FILESYSTEM=1
          echo "==> CWD=$(pwd)"
          ls -la .git 2>&1 | head -5
          # OnscripterYuri 公共子模块
          git submodule update --init --depth 1 packages/OnscripterYuri
          # .gitmodules 中 psdfile 引用 SSH,CI 中强制覆盖为 HTTPS,免去 SSH 部署
          git -c submodule.packages/psdfile.url=https://github.com/AetherKiri/psdfile.git \
              submodule update --init --recursive --depth 1 packages/psdfile

      - name: 缓存工具链与下载
        uses: actions/cache@v4
        with:
          path: |
            .aetherkiri-cache/godot
            .aetherkiri-cache/downloads
            .aetherkiri-cache/vcpkg
            .aetherkiri-cache/system-tools
          key: linux-x64-cache-v1-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/workflows/x64.yml') }}
          restore-keys: |
            linux-x64-cache-v1-${{ runner.os }}-

      - name: 安装模块
        run: |
          set -euo pipefail
          # 自动克隆并 bootstrap vcpkg、下载 Godot 4.7-stable 与 export templates
          bash tools/setup_linux.sh

      - name: 配置 ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache -z

      - name: 配置 vcpkg 二进制缓存
        env:
          VCPKG_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set +e  # 本步骤不致命:缓存连不上最多让首次构建慢一点,不该拖垮整个流水线
          # 复用上游脚本,接入 GitHub Packages 缓存,大幅加速重复构建
          if [[ -f .github/scripts/configure-vcpkg-binary-cache.sh ]]; then
            echo "==> 尝试配置 vcpkg NuGet 二进制缓存(GitHub Packages)"
            bash .github/scripts/configure-vcpkg-binary-cache.sh "$VCPKG_ROOT/vcpkg"
            rc=$?
            if [[ $rc -ne 0 ]]; then
              echo "::warning::vcpkg 二进制缓存配置失败(rc=$rc),将仅使用本地编译,继续构建"
            fi
          else
            echo "::notice::未找到 vcpkg 二进制缓存脚本,跳过(继续构建)"
          fi

      - name: 编译
        continue-on-error: true
        run: |
          set -euo pipefail
          source tools/linux_env.sh
          chmod +x ./build.sh
          echo "==> 编译器版本自检"
          gcc --version | head -1
          g++ --version | head -1
          # gobjc 在 Deepin 仓库可能不存在,非致命,自检降级为尽力输出
          which gobjc >/dev/null 2>&1 && gobjc --version | head -1 || echo "(gobjc 不可用,依赖下方 OBJC sed 修补)"
          cmake --version | head -1
          which ninja
          ninja --version
          # 给 ccache 一个 tempdir,避免它在 CCACHE_DIR 之外的任何地方写状态
          mkdir -p "$RUNNER_TEMP/ccache-tmp"
          export CCACHE_TEMPDIR="$RUNNER_TEMP/ccache-tmp"

          # AetherKiri 的 overlay pango portfile 硬编了 LANGUAGES C CXX OBJC,
          # 这个是为 darwin 交叉编译准备的,但在 Linux native 容器里会让
          # vcpkg_cmake_get_vars 在探测 OBJC 编译器时反复跪(meson build 不需要,但 cmake 必须能成功探测)。
          # 我们 Linux 编译用不到 darwin,直接把 OBJC 摘掉,既不会破坏 pango 的构建(meson.build 里 OBJ-C 代码
          # 是 if host_machine.system() == 'darwin' 才编),又能彻底避开容器里没 gobjc 的尴尬。
          PANGO_PORT="${GITHUB_WORKSPACE}/vcpkg/ports/pango/portfile.cmake"
          if [[ -f "${PANGO_PORT}" ]]; then
            if grep -q 'LANGUAGES C CXX OBJC' "${PANGO_PORT}"; then
              sed -i 's/LANGUAGES C CXX OBJC/LANGUAGES C CXX/' "${PANGO_PORT}"
              echo "==> 已为 Linux 移除 pango overlay 的 OBJC,新内容:"
              grep -n 'LANGUAGES' "${PANGO_PORT}" || true
            else
              echo "==> pango overlay 已经没有 OBJC,跳过"
            fi
          else
            echo "::warning::未找到 ${PANGO_PORT},跳过 sed(可能是 vcpkg-configuration.json 未配置 overlay)"
          fi

          # 兜底:libgdiplus overlay 在 Linux 上硬编 -DWITH_X11=ON,即便装了 X11 dev,
          # mono-libgdiplus 的 cmake 偶尔也会因为 pthreadstubs / Xrender 找不到而跪。
          # 关掉 X11 是最后防线(只损失 libgdiplus 的 X11 surface 能力,Godot 视觉小说不依赖)。
          LIBGDIPLUS_PORT="${GITHUB_WORKSPACE}/vcpkg/ports/libgdiplus/portfile.cmake"
          if [[ -f "${LIBGDIPLUS_PORT}" ]] && grep -q 'WITH_X11=ON' "${LIBGDIPLUS_PORT}"; then
            echo "==> libgdiplus overlay 仍硬编 WITH_X11=ON,先按 '已装 X11 dev' 尝试;"
            echo "    若下一轮仍 BUILD_FAILED,可改为 WITH_X11=OFF 兜底。"
          fi

          echo "==> 开始 Linux ${BUILD_TYPE} 编译 (vcpkg 并发=${VCPKG_MAX_CONCURRENCY}, cmake/构建并发=$(nproc))"
          # ./build.sh linux release 内部已自带 parallelism 控制
          ./build.sh linux "$BUILD_TYPE" --jobs=$(nproc) 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: ccache 统计
        if: always()
        run: |
          echo "==> ccache 统计"
          ccache -s || true

      - name: 校验构建产物
        if: always()
        run: |
          set -euo pipefail
          BIN_DIR="out/godot/linux/${BUILD_TYPE}"
          BIN="$BIN_DIR/AetherKiri.x86_64"
          if [[ -f "$BIN" ]]; then
            echo "==> 二进制存在"
            ls -lh "$BIN"
            file "$BIN"
            echo "==> 共享库依赖(前 30 行)"
            ldd "$BIN" | head -30
            echo "==> 完整产物清单"
            ls -lh "$BIN_DIR"
          else
            echo "::error::构建产物未生成:$BIN"
            exit 1
          fi

      - name: 收集构建日志
        if: always()
        run: |
          mkdir -p build-logs
          if [[ -f "$RUNNER_TEMP/build.log" ]]; then
            cp "$RUNNER_TEMP/build.log" build-logs/build.log
            echo "==> 构建日志尾部(最后 100 行)"
            tail -100 build-logs/build.log
          else
            echo "==> build.log 不存在,跳过日志收集"
          fi
          # 把 vcpkg 每个 port 的 config-*-out.log 直接打到控制台:
          # vcpkg 的 BUILD_FAILED 主日志只有一行,真实报错都在 buildtrees/<port>/ 下。
          # 这里直接在 Actions 日志里展开,免去翻 artifact。
          BT="${{ github.workspace }}/.aetherkiri-cache/vcpkg/buildtrees"
          if [[ -d "$BT" ]]; then
            find "$BT" -maxdepth 2 -type f -name "config-*-out.log" 2>/dev/null | sort | while read -r f; do
              rel="${f#$BT/}"
              # 只打最近 1 小时内修改过的(即本次运行产生的),避免缓存里的旧日志刷屏
              if [[ -n "$(find "$f" -mmin -60 2>/dev/null)" ]]; then
                echo ""
                echo "=============================================="
                echo "==> vcpkg configure 日志: $rel (尾部 80 行)"
                echo "=============================================="
                tail -80 "$f" || true
              fi
            done
          fi

      - name: 收集 vcpkg buildtrees 日志(失败诊断)
        if: failure()
        run: |
          # 出错时把 vcpkg 内部的 buildtrees/*.log 一并归档,这些是 pango 等子 port
          # 真正失败细节的所在(主日志只显示一行错误,真正的报错在子日志里)
          mkdir -p build-logs/vcpkg-buildtrees
          if [[ -d "${{ github.workspace }}/.aetherkiri-cache/vcpkg/buildtrees" ]]; then
            find "${{ github.workspace }}/.aetherkiri-cache/vcpkg/buildtrees" \
              -maxdepth 4 -type f \( -name "*.log" -o -name "*ConfigureLog*" \) \
              2>/dev/null | head -200 | while read -r f; do
                rel="${f#${{ github.workspace }}/.aetherkiri-cache/vcpkg/buildtrees/}"
                mkdir -p "build-logs/vcpkg-buildtrees/$(dirname "$rel")"
                cp "$f" "build-logs/vcpkg-buildtrees/$rel" || true
              done
            echo "==> 收集到 $(find build-logs/vcpkg-buildtrees -type f | wc -l) 个 vcpkg 日志片段"
          fi

      - name: 收集 cmake 系统探测日志(诊断用)
        if: failure()
        run: |
          # vcpkg 工具链会跑一个微型 cmake 项目探编译器,真正的失败原因在这些 .out.log 里
          mkdir -p build-logs/cmake-detection
          if [[ -d "${{ github.workspace }}/.aetherkiri-cache/vcpkg/buildtrees" ]]; then
            find "${{ github.workspace }}/.aetherkiri-cache/vcpkg/buildtrees" \
              -type f -name "*-out.log" \
              2>/dev/null | head -50 | while read -r f; do
                cp "$f" build-logs/cmake-detection/ 2>/dev/null || true
              done
            ls -lh build-logs/cmake-detection/ 2>/dev/null || true
          fi

      - name: 打包构建产物
        if: always()
        run: |
          set -euo pipefail
          BIN_DIR="out/godot/linux/${BUILD_TYPE}"
          BIN="$BIN_DIR/AetherKiri.x86_64"
          if [[ ! -f "$BIN" ]]; then
            echo "::warning::跳过打包:二进制不存在"
            exit 0
          fi
          cd "$BIN_DIR"
          ARCHIVE_NAME="AetherKiri-linux-x64-${BUILD_TYPE}.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$ARCHIVE_NAME" .
          cd "$GITHUB_WORKSPACE"
          ls -lh "$ARCHIVE_NAME"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AetherKiri-linux-x64-${{ inputs.build_type }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: warn
          retention-days: 7

      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AetherKiri-linux-x64-build-log
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 3